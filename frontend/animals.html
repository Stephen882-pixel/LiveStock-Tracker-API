<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animals Management - LiveStock Tracker</title>
     <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">🐄 LiveStock Tracker</a>
            <ul class="nav-links">
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="breeds.html">Breeds</a></li>
                <li><a href="animals.html" class="active">Animals</a></li>
                <li><a href="health.html">Health</a></li>
                <li><a href="tracking.html">Tracking</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1 class="page-title">🐄 Animals Management</h1>
                <p class="page-subtitle">Track individual animals and their information</p>
            </div>

            <div class="form-section">
                <h2 class="form-title">➕ Add New Animal</h2>
                <form id="animal-form">
                    <div class="form-grid">
                        <input type="text" id="animal-tag" placeholder="Tag ID" required>
                        <input type="text" id="animal-name" placeholder="Name" required>
                        <select id="animal-breed" required>
                            <option value="">Select Breed</option>
                        </select>
                        <select id="animal-gender" required>
                            <option value="">Select Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                        <input type="date" id="animal-dob" placeholder="Date of Birth" required>
                        <input type="number" id="animal-weight" placeholder="Weight (kg)" step="0.01" required>
                        <input type="text" id="animal-color" placeholder="Color">
                        <select id="animal-status">
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                            <option value="sold">Sold</option>
                            <option value="deceased">Deceased</option>
                        </select>
                        <select id="animal-health">
                            <option value="healthy">Healthy</option>
                            <option value="sick">Sick</option>
                            <option value="under_treatment">Under Treatment</option>
                            <option value="recovering">Recovering</option>
                        </select>
                        <input type="text" id="animal-location" placeholder="Location">
                        <textarea id="animal-notes" placeholder="Notes"></textarea>
                    </div>
                    <button type="submit">Add Animal</button>
                </form>
                <div class="error hidden" id="animal-error"></div>
                <div class="success hidden" id="animal-success"></div>
            </div>

            <div class="table-section">
                <h2 class="table-title">📋 Animals List</h2>
                <table id="animals-table">
                    <thead>
                        <tr>
                            <th>Tag ID</th>
                            <th>Name</th>
                            <th>Breed</th>
                            <th>Gender</th>
                            <th>Age (Years)</th>
                            <th>Weight</th>
                            <th>Status</th>
                            <th>Health</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="animals.js"></script>
</body>
</html>
